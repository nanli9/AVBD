[project]
name = "avbd3d"
version = "0.1.0"
description = "3D Augmented Vertex Block Descent (AVBD) rigid-body solver in NVIDIA Warp"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "viser>=1.0.29",
    "warp-lang>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avbd3d"]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pytest>=9.0.3",
]
